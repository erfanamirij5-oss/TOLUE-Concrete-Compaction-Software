name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Run engineering validation gate
        run: npm test
      - name: Run production frontend build gate
        run: npm run build
      - name: Generate TOLUE desktop icons
        run: npm run tauri icon src-tauri/app-icon.svg
      - name: Build TOLUE Concrete Compaction
        run: npm run desktop:build
      - name: RC smoke test NSIS install launch and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found.' }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($install.ExitCode)." }

          $appExe = Get-ChildItem $env:LOCALAPPDATA -Filter 'tolue-concrete-compaction-software.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { throw 'Installed TOLUE executable was not found after NSIS install.' }
          Write-Host "Installed executable: $($appExe.FullName)"

          $app = Start-Process -FilePath $appExe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Installed NSIS application exited during launch smoke test with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force
          Write-Host 'NSIS installed application launch smoke test passed.'

          $uninstaller = Get-ChildItem $appExe.DirectoryName -Filter '*uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS uninstaller was not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS silent uninstall failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 3
          if (Test-Path $appExe.FullName) { throw 'TOLUE executable still exists after NSIS uninstall.' }
      - name: RC smoke test MSI install launch and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer not found.' }

          $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI silent install failed with exit code $($install.ExitCode)." }

          $installed = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)',$env:LOCALAPPDATA -Filter 'tolue-concrete-compaction-software.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Installed TOLUE executable was not found after MSI install.' }
          Write-Host "MSI installed executable: $($installed.FullName)"

          $app = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Installed MSI application exited during launch smoke test with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force
          Write-Host 'MSI installed application launch smoke test passed.'

          $uninstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI silent uninstall failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 3
          if (Test-Path $installed.FullName) { throw 'TOLUE executable still exists after MSI uninstall.' }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: TOLUE-Concrete-Compaction-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
