name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Run engineering validation gate
        run: npm test
      - name: Generate TOLUE desktop icons
        run: npm run tauri icon src-tauri/app-icon.svg
      - name: Build TOLUE Concrete Compaction
        run: npm run desktop:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: TOLUE-Concrete-Compaction-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
